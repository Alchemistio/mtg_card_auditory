name: One-time Rust formatting repair

on:
  push:
    branches:
      - automation/rustfmt-repair

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: automation/rustfmt-repair
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install rustfmt
        run: rustup toolchain install stable --component rustfmt
      - name: Format Rust sources
        run: cargo +stable fmt --all
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Apply rustfmt formatting"
          git push origin HEAD:automation/rustfmt-repair
